<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 Tank Battle</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #1a1c24;
    --gold: #f5c542;
    --text: #e8eaf0;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(1200px 700px at 50% -10%, #23262f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 2px 0 #7a5a12;
    font-weight: 800;
  }
  h1 small { color: var(--muted); font-weight: 400; letter-spacing: 1px; font-size: 13px; }
  .hud {
    width: 100%;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid #2c2f3a;
    border-radius: 8px;
    padding: 6px 12px;
    min-width: 72px;
    text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #fff; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stage {
    position: relative;
    border: 3px solid #2c2f3a;
    border-radius: 8px;
    background: #060607;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    overflow: hidden;
    line-height: 0;
  }
  canvas { display: block; image-rendering: pixelated; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: rgba(4,5,8,.78);
    text-align: center;
    padding: 20px;
  }
  .overlay h2 {
    margin: 0; font-size: 30px; color: var(--gold); letter-spacing: 4px;
    text-shadow: 0 2px 0 #000;
  }
  .overlay p { margin: 0; color: var(--text); font-size: 15px; line-height: 1.7; }
  .overlay .hint { color: var(--muted); font-size: 13px; animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .help {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.9;
    text-align: center;
  }
  .help b { color: var(--text); }
  .controls {
    width: 100%;
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 4px;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 4px; }
  .dpad button, .fire {
    border: 1px solid #3a3e4c;
    background: var(--panel);
    color: var(--text);
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad button:active, .fire:active { background: #333845; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .fire {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #7a2020;
    border-color: #b04545;
    font-size: 15px;
    letter-spacing: 2px;
    color: #fff;
  }
  @media (pointer: coarse) {
    .controls { display: flex; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>坦克大战 <small>TANK BATTLE</small></h1>

  <div class="hud">
    <div class="stat"><b id="score">0</b><span>得分</span></div>
    <div class="stat"><b id="lives">3</b><span>生命</span></div>
    <div class="stat"><b id="enemies">0</b><span>剩余敌人</span></div>
    <div class="stat"><b id="level">1</b><span>关卡</span></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">坦克大战</h2>
      <p id="overlay-sub">TANK BATTLE</p>
      <p class="hint" id="overlay-hint">按 Enter 开始游戏</p>
    </div>
  </div>

  <div class="help">
    <b>移动</b>：方向键 / WASD &nbsp;·&nbsp; <b>开火</b>：空格 / J &nbsp;·&nbsp; <b>暂停</b>：P<br>
    保护基地 🦅，消灭所有敌人，捡取道具强化自己
  </div>

  <div class="controls" id="controls">
    <div class="dpad">
      <button class="up" data-key="arrowup">▲</button>
      <button class="left" data-key="arrowleft">◀</button>
      <button class="down" data-key="arrowdown">▼</button>
      <button class="right" data-key="arrowright">▶</button>
    </div>
    <button class="fire" data-key=" ">FIRE</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const enemiesEl = document.getElementById('enemies');
  const levelEl = document.getElementById('level');
  const overlayEl = document.getElementById('overlay');
  const overlayTitleEl = document.getElementById('overlay-title');
  const overlaySubEl = document.getElementById('overlay-sub');
  const overlayHintEl = document.getElementById('overlay-hint');

  // ---------- 常量 ----------
  const TILE = 32, COLS = 15, ROWS = 13;
  const FIELD_W = COLS * TILE, FIELD_H = ROWS * TILE;
  const TANK = 28, OFF = (TILE - TANK) / 2; // 坦克在格子内的偏移(居中)
  const BULLET = 6;

  const T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_TREE = 4, T_BASE = 5;
  const CHAR = { '.': T_EMPTY, 'B': T_BRICK, 'S': T_STEEL, 'W': T_WATER, 'T': T_TREE, 'E': T_BASE };

  // ---------- 画布高清适配 ----------
  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = FIELD_W * dpr;
    canvas.height = FIELD_H * dpr;
    canvas.style.width = FIELD_W + 'px';
    canvas.style.height = FIELD_H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();

  // ---------- 地图 ----------
  const RAW_MAP = [
    "...............",
    ".BBB..BBB..BBB.",
    ".B.B..B.B..B.B.",
    ".B.B..SSS..B.B.",
    ".....SS.SS.....",
    ".....SS.SS.....",
    ".SS..........SS",
    ".SS..WWWWW..SS.",
    ".....WWWWW.....",
    ".BB..........BB",
    ".BB..BBBBB..BB.",
    ".....B...B.....",
    ".....B.E.B.....",
  ];

  let map = [];
  let basePos = null;

  function buildMap() {
    map = RAW_MAP.map((row, ty) => row.split('').map((c, tx) => {
      const t = CHAR[c] !== undefined ? CHAR[c] : T_EMPTY;
      if (t === T_BASE) basePos = { tx, ty };
      return t;
    }));
  }

  // ---------- 音频 ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur);
  }
  const sfxShoot = () => tone(820, 0.09, 'square', 0.07, 200);
  const sfxExplode = () => tone(160, 0.28, 'sawtooth', 0.14, 40);
  const sfxHit = () => tone(320, 0.09, 'square', 0.08, 120);
  const sfxPickup = () => { tone(520, 0.1, 'square', 0.1); setTimeout(() => tone(780, 0.14, 'square', 0.1), 90); };

  // ---------- 输入 ----------
  const keys = {};
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    keys[k] = true;
    ensureAudio();
    if (k === 'enter') {
      if (state === 'menu' || state === 'gameover') startGame();
      else if (state === 'paused') setState('playing');
    } else if (k === ' ' && state === 'menu') {
      startGame();
    } else if (k === 'p') {
      if (state === 'playing') setState('paused');
      else if (state === 'paused') setState('playing');
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  // 触屏按钮
  document.querySelectorAll('#controls button').forEach(btn => {
    const k = btn.dataset.key;
    const down = (e) => { e.preventDefault(); keys[k] = true; ensureAudio(); };
    const up = (e) => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
  });

  // ---------- 工具 ----------
  function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // ---------- 游戏状态 ----------
  let state = 'menu'; // menu | playing | paused | gameover
  let score = 0, lives = 3, level = 1;
  let player = null;
  let enemies = [], bullets = [], powerups = [], explosions = [];
  let enemiesRemaining = 0, spawnTimer = 0, respawnTimer = 0, levelFlash = 0;
  let baseAlive = true;

  const SPAWNS = [
    { x: 0 * TILE + OFF, y: 0 * TILE + OFF },
    { x: 7 * TILE + OFF, y: 0 * TILE + OFF },
    { x: 14 * TILE + OFF, y: 0 * TILE + OFF },
  ];

  function createPlayer() {
    player = {
      x: 7 * TILE + OFF, y: 11 * TILE + OFF,
      dir: 'up', speed: 132,
      cooldown: 0, power: 0, alive: true, shield: 0,
    };
  }

  function createEnemy() {
    const fast = (level >= 2 && Math.random() < 0.3) || (level >= 4 && Math.random() < 0.45);
    return {
      x: 0, y: 0, dir: 'down',
      speed: fast ? 96 : 56,
      cooldown: 1 + Math.random() * 2,
      alive: true, fast: fast,
      spawnFlash: 0.8, moveTimer: 0.8,
    };
  }

  // ---------- 移动与碰撞 ----------
  function snapToLane(tank) {
    if (tank.dir === 'up' || tank.dir === 'down') {
      tank.x = Math.round((tank.x - OFF) / TILE) * TILE + OFF;
    } else {
      tank.y = Math.round((tank.y - OFF) / TILE) * TILE + OFF;
    }
  }

  function tankCollides(x, y, self) {
    if (x < 0 || y < 0 || x + TANK > FIELD_W || y + TANK > FIELD_H) return true;
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + TANK - 1) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + TANK - 1) / TILE);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const t = map[ty][tx];
        if (t === T_BRICK || t === T_STEEL || t === T_WATER || t === T_BASE) return true;
      }
    }
    const list = [player, ...enemies];
    for (const t of list) {
      if (t === self || !t.alive) continue;
      if (rectOverlap(x, y, TANK, TANK, t.x, t.y, TANK, TANK)) return true;
    }
    return false;
  }

  function moveTank(tank, dir, dt) {
    if (dir !== tank.dir) { tank.dir = dir; snapToLane(tank); }
    const sp = tank.speed * dt;
    let nx = tank.x, ny = tank.y;
    if (dir === 'up') ny -= sp;
    else if (dir === 'down') ny += sp;
    else if (dir === 'left') nx -= sp;
    else if (dir === 'right') nx += sp;
    if (!tankCollides(nx, ny, tank)) { tank.x = nx; tank.y = ny; return true; }
    return false;
  }

  function tankAt(x, y) {
    if (player.alive && rectOverlap(x, y, TANK, TANK, player.x, player.y, TANK, TANK)) return true;
    for (const e of enemies) if (e.alive && rectOverlap(x, y, TANK, TANK, e.x, e.y, TANK, TANK)) return true;
    return false;
  }

  // ---------- 子弹 ----------
  function shoot(tank, owner) {
    const cx = tank.x + TANK / 2, cy = tank.y + TANK / 2;
    const ox = tank.dir === 'left' ? -1 : tank.dir === 'right' ? 1 : 0;
    const oy = tank.dir === 'up' ? -1 : tank.dir === 'down' ? 1 : 0;
    const mx = cx + ox * (TANK / 2 + 3);
    const my = cy + oy * (TANK / 2 + 3);
    const power = owner === 'player' ? tank.power : 0;
    bullets.push({
      x: mx - BULLET / 2, y: my - BULLET / 2,
      dir: tank.dir, owner: owner,
      speed: owner === 'player' ? 320 : 230,
      power: power, alive: true,
    });
    if (owner === 'player') sfxShoot();
  }

  function countPlayerBullets() {
    return bullets.filter(b => b.owner === 'player' && b.alive).length;
  }

  function updateBullets(dt) {
    for (const b of bullets) {
      const sp = b.speed * dt;
      if (b.dir === 'up') b.y -= sp;
      else if (b.dir === 'down') b.y += sp;
      else if (b.dir === 'left') b.x -= sp;
      else if (b.dir === 'right') b.x += sp;

      const cx = b.x + BULLET / 2, cy = b.y + BULLET / 2;
      if (cx < 0 || cy < 0 || cx >= FIELD_W || cy >= FIELD_H) { b.alive = false; continue; }

      const tx = Math.floor(cx / TILE), ty = Math.floor(cy / TILE);
      const tile = map[ty][tx];

      if (tile === T_BRICK) {
        map[ty][tx] = T_EMPTY;
        addExplosion(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 9);
        if (b.power < 2) b.alive = false;
      } else if (tile === T_STEEL) {
        if (b.power >= 2) {
          map[ty][tx] = T_EMPTY;
          addExplosion(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 9);
        } else {
          b.alive = false;
          addExplosion(cx, cy, 6);
        }
      } else if (tile === T_BASE) {
        if (b.owner === 'enemy') {
          map[ty][tx] = T_EMPTY;
          baseAlive = false;
          addExplosion(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 22);
          b.alive = false;
        }
      }
      if (!b.alive) continue;

      if (b.owner === 'player') {
        for (const e of enemies) {
          if (!e.alive || e.spawnFlash > 0) continue;
          if (rectOverlap(b.x, b.y, BULLET, BULLET, e.x, e.y, TANK, TANK)) {
            e.alive = false; b.alive = false;
            onEnemyDestroyed(e);
            break;
          }
        }
      } else {
        if (player.alive && rectOverlap(b.x, b.y, BULLET, BULLET, player.x, player.y, TANK, TANK)) {
          b.alive = false;
          onPlayerHit();
        }
      }
    }

    // 子弹相撞抵消
    for (let i = 0; i < bullets.length; i++) {
      for (let j = i + 1; j < bullets.length; j++) {
        const a = bullets[i], c = bullets[j];
        if (a.alive && c.alive && a.owner !== c.owner &&
            rectOverlap(a.x, a.y, BULLET, BULLET, c.x, c.y, BULLET, BULLET)) {
          a.alive = false; c.alive = false;
          addExplosion((a.x + c.x) / 2, (a.y + c.y) / 2, 7);
        }
      }
    }

    bullets = bullets.filter(b => b.alive);
  }

  function onEnemyDestroyed(e) {
    score += e.fast ? 300 : 200;
    addExplosion(e.x + TANK / 2, e.y + TANK / 2, 18);
    sfxExplode();
    if (Math.random() < 0.22) dropPowerup(e.x, e.y);
    updateHUD();
  }

  function onPlayerHit() {
    if (player.shield > 0) { sfxHit(); return; }
    player.alive = false;
    addExplosion(player.x + TANK / 2, player.y + TANK / 2, 18);
    sfxExplode();
    lives--;
    updateHUD();
    if (lives > 0) respawnTimer = 1.5;
    else setState('gameover');
  }

  // ---------- 玩家 ----------
  function updatePlayer(dt) {
    if (!player.alive) {
      if (respawnTimer > 0) {
        respawnTimer -= dt;
        if (respawnTimer <= 0) {
          createPlayer();
          player.shield = 3;
        }
      }
      return;
    }

    let dir = null;
    if (keys['arrowup'] || keys['w']) dir = 'up';
    else if (keys['arrowdown'] || keys['s']) dir = 'down';
    else if (keys['arrowleft'] || keys['a']) dir = 'left';
    else if (keys['arrowright'] || keys['d']) dir = 'right';
    if (dir) moveTank(player, dir, dt);

    player.cooldown -= dt;
    const firing = keys[' '] || keys['j'];
    const maxBullets = [1, 2, 3][player.power];
    if (firing && player.cooldown <= 0 && countPlayerBullets() < maxBullets) {
      shoot(player, 'player');
      player.cooldown = 0.32;
    }

    if (player.shield > 0) player.shield -= dt;
  }

  // ---------- 敌人 ----------
  function pickEnemyDir(e) {
    const dirs = ['up', 'down', 'left', 'right'];
    const others = dirs.filter(d => d !== e.dir);
    if (Math.random() < 0.3) return 'down';
    return others[Math.floor(Math.random() * others.length)];
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      if (e.spawnFlash > 0) { e.spawnFlash -= dt; continue; }
      e.moveTimer -= dt;
      if (e.moveTimer <= 0) {
        e.moveTimer = 0.8 + Math.random() * 1.6;
        e.dir = pickEnemyDir(e);
      }
      if (!moveTank(e, e.dir, dt)) {
        e.dir = pickEnemyDir(e);
        e.moveTimer = 0.3 + Math.random() * 0.5;
      }
      e.cooldown -= dt;
      if (e.cooldown <= 0) {
        shoot(e, 'enemy');
        e.cooldown = 1.4 + Math.random() * 2.2;
      }
    }
    enemies = enemies.filter(e => e.alive);
  }

  function spawnEnemies(dt) {
    if (enemiesRemaining <= 0) return;
    if (enemies.length >= 4) return;
    spawnTimer -= dt;
    if (spawnTimer > 0) return;
    const free = SPAWNS.filter(s => !tankAt(s.x, s.y));
    if (free.length === 0) return;
    const s = free[Math.floor(Math.random() * free.length)];
    const e = createEnemy();
    e.x = s.x; e.y = s.y;
    enemies.push(e);
    enemiesRemaining--;
    spawnTimer = 2.0;
  }

  // ---------- 道具 ----------
  const POWER_COLORS = { star: '#ffd54a', shield: '#4aa3ff', life: '#4ae07a', grenade: '#cfd2d8' };

  function dropPowerup(x, y) {
    const types = ['star', 'shield', 'life', 'grenade'];
    powerups.push({
      x: x + 2, y: y + 2,
      type: types[Math.floor(Math.random() * types.length)],
      blink: 0,
    });
  }

  function applyPowerup(type) {
    sfxPickup();
    if (type === 'star') player.power = Math.min(player.power + 1, 2);
    else if (type === 'shield') player.shield = 8;
    else if (type === 'life') lives++;
    else if (type === 'grenade') {
      for (const e of enemies) {
        if (e.alive) {
          e.alive = false; score += 150;
          addExplosion(e.x + TANK / 2, e.y + TANK / 2, 18);
        }
      }
      sfxExplode();
    }
    updateHUD();
  }

  function updatePowerups(dt) {
    for (const p of powerups) {
      p.blink += dt;
      if (player.alive && rectOverlap(player.x, player.y, TANK, TANK, p.x, p.y, TILE - 4, TILE - 4)) {
        applyPowerup(p.type);
        p.dead = true;
      }
    }
    powerups = powerups.filter(p => !p.dead);
  }

  // ---------- 爆炸 ----------
  function addExplosion(cx, cy, r) {
    explosions.push({ x: cx, y: cy, r: r, t: 0.3 });
  }
  function updateExplosions(dt) {
    for (const e of explosions) e.t -= dt;
    explosions = explosions.filter(e => e.t > 0);
  }

  // ---------- 关卡流程 ----------
  function startLevel() {
    buildMap();
    baseAlive = true;
    enemies = []; bullets = []; powerups = [];
    enemiesRemaining = Math.min(18 + level * 2, 30);
    spawnTimer = 1;
    levelFlash = 1.6;
    player.x = 7 * TILE + OFF;
    player.y = 11 * TILE + OFF;
    player.dir = 'up';
    updateHUD();
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    createPlayer();
    startLevel();
    setState('playing');
  }

  function checkWinLose() {
    if (!baseAlive) { setState('gameover'); return; }
    if (enemiesRemaining <= 0 && enemies.length === 0) {
      level++;
      startLevel();
    }
  }

  function setState(s) {
    state = s;
    if (s === 'playing') {
      overlayEl.style.display = 'none';
    } else {
      overlayEl.style.display = 'flex';
      if (s === 'menu') {
        overlayTitleEl.textContent = '坦克大战';
        overlaySubEl.textContent = 'TANK BATTLE';
        overlayHintEl.textContent = '按 Enter 开始游戏';
      } else if (s === 'paused') {
        overlayTitleEl.textContent = '暂停';
        overlaySubEl.textContent = '';
        overlayHintEl.textContent = '按 P 继续';
      } else if (s === 'gameover') {
        overlayTitleEl.textContent = '游戏结束';
        overlaySubEl.textContent = '最终得分 ' + score;
        overlayHintEl.textContent = '按 Enter 重新开始';
      }
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    enemiesEl.textContent = enemiesRemaining + enemies.length;
    levelEl.textContent = level;
  }

  // ---------- 渲染 ----------
  function drawBrick(x, y) {
    ctx.fillStyle = '#b5651d';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#7a3d12';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
    ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
    ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
    ctx.moveTo(x + 3 * TILE / 4, y + TILE / 2); ctx.lineTo(x + 3 * TILE / 4, y + TILE);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(x, y, TILE, 2);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = '#c8ccd0';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#9aa0a6';
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = '#e8ecef';
    ctx.fillRect(x + 2, y + 2, TILE - 4, 3);
    ctx.fillRect(x + 2, y + 2, 3, TILE - 4);
  }

  function drawWater(x, y) {
    ctx.fillStyle = '#1c4f8f';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#3d7bd1';
    const t = performance.now() / 450;
    for (let i = 0; i < 2; i++) {
      const yy = y + ((i * TILE / 2 + t * 16) % TILE);
      ctx.fillRect(x, yy, TILE, 2);
    }
  }

  function drawTree(x, y) {
    const cx = x + TILE / 2, cy = y + TILE / 2;
    ctx.fillStyle = 'rgba(28, 86, 28, .9)';
    ctx.beginPath(); ctx.arc(cx, cy, TILE / 2 - 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(52, 130, 48, .9)';
    ctx.beginPath(); ctx.arc(cx - 4, cy - 3, TILE / 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4, cy + 2, TILE / 4, 0, Math.PI * 2); ctx.fill();
  }

  function drawEagle(x, y) {
    drawBrick(x, y);
    const cx = x + TILE / 2, cy = y + TILE / 2 + 1;
    ctx.fillStyle = '#e8b13d';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx - 10, cy - 9, cx - 14, cy - 2);
    ctx.quadraticCurveTo(cx - 8, cy + 1, cx - 2, cy + 2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx + 10, cy - 9, cx + 14, cy - 2);
    ctx.quadraticCurveTo(cx + 8, cy + 1, cx + 2, cy + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c98b2a';
    ctx.beginPath(); ctx.ellipse(cx, cy, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f6e6c8';
    ctx.beginPath(); ctx.arc(cx, cy - 7, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e88b2d';
    ctx.beginPath();
    ctx.moveTo(cx + 2, cy - 8); ctx.lineTo(cx + 7, cy - 6); ctx.lineTo(cx + 2, cy - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(cx + 1, cy - 8, 1, 0, Math.PI * 2); ctx.fill();
  }

  function drawTank(t) {
    if (t.spawnFlash !== undefined && t.spawnFlash > 0 && Math.floor(t.spawnFlash * 10) % 2 === 0) return;
    let colors;
    if (t === player) colors = { body: '#4da64d', dark: '#2f6f2f', light: '#7fd17f' };
    else if (t.fast) colors = { body: '#c74444', dark: '#8a2c2c', light: '#e07b7b' };
    else colors = { body: '#9aa0a6', dark: '#6b7076', light: '#c8ccd0' };

    const a = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[t.dir] || 0;
    ctx.save();
    ctx.translate(t.x + TANK / 2, t.y + TANK / 2);
    ctx.rotate(a);
    const h = TANK / 2;
    ctx.fillStyle = colors.dark;
    ctx.fillRect(-h, -h, 5, TANK);
    ctx.fillRect(h - 5, -h, 5, TANK);
    ctx.fillStyle = colors.body;
    ctx.fillRect(-h + 5, -h + 3, TANK - 10, TANK - 6);
    ctx.fillStyle = colors.dark;
    ctx.fillRect(-2, -h, 4, 10); // 炮管
    ctx.fillStyle = colors.light;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (t.shield > 0) {
      ctx.strokeStyle = 'rgba(80, 180, 255, .85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x + TANK / 2, t.y + TANK / 2, TANK / 2 + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.fillStyle = b.owner === 'player' ? '#ffffff' : '#ffe08a';
      ctx.fillRect(b.x, b.y, BULLET, BULLET);
    }
  }

  function drawExplosions() {
    for (const e of explosions) {
      const life = e.t / 0.3;
      const p = 1 - life;
      ctx.fillStyle = 'rgba(255, ' + Math.floor(210 - p * 130) + ', 60, ' + life.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (0.5 + p * 0.7), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      if (Math.floor(p.blink * 4) % 2 === 0) {
        const s = TILE - 4;
        ctx.fillStyle = POWER_COLORS[p.type] || '#fff';
        ctx.fillRect(p.x, p.y, s, s);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x + 0.5, p.y + 0.5, s - 1, s - 1);
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const t = map[ty][tx], x = tx * TILE, y = ty * TILE;
        if (t === T_BRICK) drawBrick(x, y);
        else if (t === T_STEEL) drawSteel(x, y);
        else if (t === T_WATER) drawWater(x, y);
        else if (t === T_BASE) drawEagle(x, y);
      }
    }
    drawPowerups();
    for (const e of enemies) drawTank(e);
    if (player && player.alive) drawTank(player);
    drawBullets();
    drawExplosions();
    // 树画在最上层以遮挡坦克
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (map[ty][tx] === T_TREE) drawTree(tx * TILE, ty * TILE);
      }
    }
    if (levelFlash > 0) {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(0, FIELD_H / 2 - 22, FIELD_W, 44);
      ctx.fillStyle = '#f5c542';
      ctx.font = 'bold 26px "Segoe UI", "Microsoft YaHei", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('第 ' + level + ' 关', FIELD_W / 2, FIELD_H / 2);
    }
  }

  // ---------- 主循环 ----------
  function update(dt) {
    if (state !== 'playing') return;
    if (levelFlash > 0) levelFlash -= dt;
    updatePlayer(dt);
    spawnEnemies(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);
    updateExplosions(dt);
    checkWinLose();
    updateHUD();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- 初始化 ----------
  buildMap();
  createPlayer();
  updateHUD();
  setState('menu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
